name: Build tree-sitter core for Windows

# The bonede jars carry the tree-sitter core for every platform, but their Windows DLL exports only its JNI
# functions and not the C API the analysis calls. This builds the core from the pinned upstream commit and
# fails when the DLL checked in under analysis/treeSitterExcavationSite/src/main/resources/lib is not that
# build. To update the core, change the pinned commit, check in the DLL from the run's artifact and pin its
# checksum in BundledCoreLibraryTest.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'analysis/treeSitterExcavationSite/src/main/resources/lib/x86_64-windows-tree-sitter-core.dll'
      - '.github/workflows/build_tree_sitter_core_windows.yml'

permissions:
  contents: read

env:
  # v0.26.3, the version of the core in analysis/gradle/libs.versions.toml
  TREE_SITTER_COMMIT: cd4b6e2ef996d4baca12caadb78dffc8b55bc869
  LIBRARY: x86_64-windows-tree-sitter-core.dll
  CHECKED_IN_LIBRARY: analysis/treeSitterExcavationSite/src/main/resources/lib/x86_64-windows-tree-sitter-core.dll

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # to cancel the other runs of the commit when the library does not match
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install the Windows cross compiler
        run: sudo apt-get update && sudo apt-get install --yes gcc-mingw-w64-x86-64

      - name: Fetch the pinned tree-sitter commit
        run: |
          git init tree-sitter
          cd tree-sitter
          git fetch --depth 1 https://github.com/tree-sitter/tree-sitter "$TREE_SITTER_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$TREE_SITTER_COMMIT"

      # Without a build timestamp the same sources and compiler give the same file, so the build can be compared
      - name: Compile
        working-directory: tree-sitter
        run: |
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-gcc -O2 -std=c11 -shared -static-libgcc -s -Wl,--no-insert-timestamp \
            -Ilib/include -Ilib/src lib/src/lib.c -o "$LIBRARY"

      - name: Check the exported C API
        working-directory: tree-sitter
        run: |
          x86_64-w64-mingw32-objdump -p "$LIBRARY" > exports.txt
          for function in ts_parser_new ts_parser_parse_string ts_tree_root_node ts_tree_cursor_new ts_node_symbol ts_node_child_by_field_name ts_language_symbol_name; do
            grep --quiet --word-regexp "$function" exports.txt || { echo "$function is not exported"; exit 1; }
          done
          grep "DLL Name" exports.txt
          sha256sum "$LIBRARY"

      - name: Upload the library with its license
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-core-windows
          path: |
            tree-sitter/x86_64-windows-tree-sitter-core.dll
            tree-sitter/LICENSE
          if-no-files-found: error

      - name: Compare with the checked-in library
        run: |
          built=$(sha256sum "tree-sitter/$LIBRARY" | cut --delimiter=' ' --fields=1)
          checked_in=$(sha256sum "$CHECKED_IN_LIBRARY" | cut --delimiter=' ' --fields=1)
          echo "built:      $built"
          echo "checked in: $checked_in"
          test "$built" = "$checked_in"

      # A library that is not the build of the pinned sources must not be tested or packaged any further
      - name: Stop the other runs of this commit
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          gh run list --repo "$GITHUB_REPOSITORY" --commit "$COMMIT" --limit 100 --json databaseId,status \
            --jq '.[] | select(.status != "completed") | .databaseId' |
            grep --invert-match --line-regexp "$GITHUB_RUN_ID" |
            xargs --no-run-if-empty --max-args 1 gh run cancel --repo "$GITHUB_REPOSITORY"
