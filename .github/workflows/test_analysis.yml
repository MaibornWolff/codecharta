name: Analysis Tests

on:
  push:
    branches:
      - main
    paths:
      - 'analysis/**'
      # the 2.0 schema source of truth is validated by the analysis drift guard (EveritValidatorTest)
      - 'dev_docs/cc-json-2.0.schema.json'
  pull_request:
    branches:
      - main
    paths:
        - 'analysis/**'
        - 'dev_docs/cc-json-2.0.schema.json'


jobs:
 test_and_sonar_analysis:
    name: "Code Quality Results (analysis)"
    runs-on: ubuntu-latest
    env:
      working-directory: ./analysis
      project-directory: .

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js environment
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build
        working-directory: ${{env.working-directory}}

      - name: Test Analysis
        run: |
          ./gradlew integrationTest
          ./gradlew jacocoTestReport
        working-directory: ${{env.working-directory}}

      - name: Docker Test Analysis
        run: |
          user_instance="docker_runner"
          docker build ./analysis -t local-ccsh --build-arg USER_ADD=true --build-arg USER_ID=1001 --build-arg USERNAME=${user_instance} --no-cache
          current_version=$(node -pe "require('./analysis/node-wrapper/package.json').version")
          docker run -w /home/${user_instance}/cc/analysis/test -v $(pwd):/home/${user_instance}/cc local-ccsh bash ./golden_test.sh ${current_version} /home/${user_instance}/tmp-files/ /usr/local/bin/ccsh
          docker build ./analysis -t local-ccsh --no-cache
        working-directory: ${{env.project-directory}}

      - name: Setup Java JDK
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'zulu'
          java-version: 17

      - name: SonarCloud Scan Gradle
        run: |
          ./gradlew sonar
        working-directory: ${{env.working-directory}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          JAVA_HOME: ${{ env.JAVA_HOME }}

 native_tree_sitter_libraries:
    name: "Native tree-sitter libraries (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # one runner per platform the native libraries are bundled for
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    defaults:
      run:
        shell: bash
        working-directory: ./analysis

    steps:
      - uses: actions/checkout@v6

      # Gradle has to run on the JDK it compiles with: the Kotlin compiler reads that JDK's class image inside
      # Gradle's own JVM, which fails across versions for a JDK with CRaC support such as Zulu
      - name: Setup the JDK to build with
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: 25

      - name: Load and parse with every grammar
        run: ./gradlew :treeSitterExcavationSite:test --tests "*.GrammarLoadingContractTest" --tests "*.shared.infrastructure.ffm.*" -x jacocoTestReport

      - name: Build ccsh
        run: ./gradlew installDist

      - name: Setup the oldest supported Java
        uses: actions/setup-java@v5.2.0
        with:
          distribution: 'temurin'
          java-version: 22

      - name: Run ccsh on the oldest supported Java
        run: |
          java -version
          build/install/codecharta-analysis/bin/ccsh unifiedparser treeSitterExcavationSite/src/main -o native-smoke.cc.json
          test -s native-smoke.cc.json.gz
