    <body>
        <!-- Shown until the bundle has been downloaded, parsed and bootstrapped, which is a blank page
             otherwise. Angular clears the host element's content when it renders the component, so this
             needs no script to remove it. The id differs from the app's own spinner on purpose: the e2e
             helpers locate `loading-gif-file` strictly and a second element carrying it fails them. -->
        <cc-code-charta>
            <div id="boot-loading" style="
                    position: fixed;
                    inset: 0;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    background: #fff;
                    font-family: system-ui, sans-serif;
                ">
                <!-- Geometry and colours match the application's own spinner: this one hands over to it,
                     and any difference reads as a second spinner rather than the same one carrying on.
                     The ring is 6rem with a 4px border, base-300 (#d1d5db) with a primary (#1b9cfc) top,
                     and the caption hangs below it instead of sharing a column, so the ring never moves. -->
                <div style="position: relative; display: flex; align-items: center; justify-content: center">
                    <div style="
                            width: 6rem;
                            height: 6rem;
                            border: 4px solid #d1d5db;
                            border-top-color: #1b9cfc;
                            border-radius: 9999px;
                            animation: cc-boot-spin 1s linear infinite;
                        "></div>
                    <p style="
                            position: absolute;
                            left: 50%;
                            top: 100%;
                            margin-top: 1rem;
                            transform: translateX(-50%);
                            white-space: nowrap;
                            font-size: 0.875rem;
                            opacity: 0.7;
                        ">
                        Starting CodeCharta
                    </p>
                </div>
            </div>
        </cc-code-charta>
