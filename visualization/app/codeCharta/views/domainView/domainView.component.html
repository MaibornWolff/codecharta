<cc-loading-file-progress-spinner view="domain"></cc-loading-file-progress-spinner>

<cc-sidebar-explorer></cc-sidebar-explorer>

<!--
    The word cloud needs an explicitly sized container to initialize (unlike the 3D map, which mounts to
    its own element). Fill the viewport below the nav bar and above the reused bottom bar, whose height it
    publishes as --cc-bottom-bar-height. The explorer floats over the left edge, so the container starts at
    its right edge instead of at 0 — see cloudLeftInset for why the cloud must not be drawn underneath it.
-->
<div
    class="fixed right-0 top-[var(--cc-bars-height,49px)] bottom-[var(--cc-bottom-bar-height,28px)]"
    [style.left.px]="cloudLeftInset()"
>
    <cc-word-cloud [settings]="settings()"></cc-word-cloud>
</div>

<cc-bottom-bar [showSelectedWhenNotHovered]="true"></cc-bottom-bar>

<cc-domain-bar></cc-domain-bar>
