<cc-loading-file-progress-spinner view="domain"></cc-loading-file-progress-spinner>

<cc-sidebar-explorer>
    <div collapsedContent class="flex flex-1 min-w-0 items-center gap-1">
        @if (selectedNodePath()) {
            <span class="flex-1 min-w-0 truncate text-xs opacity-70" [title]="selectedNodePath()" data-testid="explorer-collapsed-path">
                {{ selectedNodePath() }}
            </span>
            <button
                type="button"
                class="btn btn-ghost btn-sm btn-square shrink-0"
                [title]="copied() ? 'Copied!' : 'Copy path'"
                data-testid="explorer-copy-path-button"
                (click)="copySelectedPath()"
            >
                <i class="fa" [class.fa-copy]="!copied()" [class.fa-check]="copied()"></i>
            </button>
        } @else {
            <span class="flex-1 min-w-0 truncate text-xs opacity-50">{{ selectedNodeName() || "No selection" }}</span>
        }
    </div>

    <cc-domain-word-list
        modeBody
        [query]="wordQuery()"
        [sorting]="wordSorting()"
        [expandedWord]="inspectedWord()"
        [selectedNodePath]="selectedNodePath()"
        (wordToggled)="toggleInspectedWord($event)"
        (nodeClicked)="selectNode($event)"
    ></cc-domain-word-list>
</cc-sidebar-explorer>

<div class="fixed right-0 top-[var(--cc-bars-height,49px)] bottom-[var(--cc-bottom-bar-height,32px)]" [style.left.px]="cloudLeftInset()">
    <cc-word-cloud
        [settings]="settings()"
        [selectedNodePath]="selectedNodePath()"
        [inspectedWord]="inspectedWord()"
        (clearSelection)="clearSelection()"
        (wordClicked)="toggleInspectedWord($event)"
        (wordRightClicked)="rightClickedWord.set($event)"
    ></cc-word-cloud>
    <cc-domain-toolbox class="absolute right-[10px] top-[10px] z-10 flex"></cc-domain-toolbox>
</div>

<cc-node-context-menu></cc-node-context-menu>

<cc-domain-word-menu
    [rightClickedWord]="rightClickedWord()"
    (showOccurrences)="showWordOccurrences($event)"
    (hideWord)="hideWord($event)"
    (closed)="closeWordMenu()"
></cc-domain-word-menu>

<cc-bottom-bar [showSelectedWhenNotHovered]="true" [selectedNodePath]="selectedNodePath()"></cc-bottom-bar>

<cc-domain-bar></cc-domain-bar>
