<div #chartContainer class="h-full w-full data-panning:*:cursor-grab!" data-testid="dependency-graph"></div>
<cc-dependency-graph-box-list
    [boxes]="scene().layout.boxes"
    [selectedPath]="scene().selectedPath"
    (boxClicked)="boxClicked.emit($event)"
    (boxToggled)="boxToggled.emit($event)"
    (boxFocused)="focusBox($event)"
></cc-dependency-graph-box-list>
