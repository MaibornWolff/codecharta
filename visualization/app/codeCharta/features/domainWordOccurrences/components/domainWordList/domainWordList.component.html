@if (visibleWords().length === 0) {
    <p class="px-3 py-4 text-sm opacity-60" data-testid="domain-word-list-empty">{{ emptyHint() }}</p>
} @else {
    @for (word of visibleWords(); track word.text) {
        <cc-domain-word-row
            [word]="word"
            [share]="shareOf(word)"
            [isExpanded]="isExpanded(word)"
            (toggled)="wordToggled.emit(word.text)"
        ></cc-domain-word-row>
        @if (isExpanded(word)) {
            <div class="pl-3">
                <cc-domain-word-occurrence-tree
                    [word]="word.text"
                    [selectedNodePath]="selectedNodePath()"
                    (nodeClicked)="nodeClicked.emit($event)"
                ></cc-domain-word-occurrence-tree>
            </div>
        }
    }
}
