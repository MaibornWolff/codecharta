<div class="relative flex items-center gap-1 pr-3 text-sm hover:bg-base-200" [style.padding-left.px]="indentPx()">
    <div class="pointer-events-none absolute inset-y-0 left-0 bg-primary/10" [style.width]="shareBarWidth()"></div>

    @if (isExpandable()) {
        <button
            type="button"
            class="relative z-10 flex h-6 w-6 shrink-0 items-center justify-center opacity-70 hover:opacity-100"
            [attr.aria-expanded]="isExpanded()"
            [attr.aria-label]="(isExpanded() ? 'Collapse ' : 'Expand ') + node().name"
            (click)="toggled.emit()"
        >
            <i class="fa fa-xs" [class.fa-chevron-right]="!isExpanded()" [class.fa-chevron-down]="isExpanded()"></i>
        </button>
    } @else {
        <span class="h-6 w-6 shrink-0"></span>
    }

    <button
        type="button"
        class="relative z-10 flex min-w-0 flex-1 items-center gap-2 py-1 text-left"
        [title]="'Reveal ' + node().path + ' in the explorer'"
        (click)="revealed.emit()"
    >
        <i class="w-3 text-center text-xs opacity-60 fa" [class.fa-folder]="node().isFolder" [class.fa-file]="!node().isFolder"></i>
        <span class="min-w-0 flex-1 truncate">{{ node().name }}</span>
        <span class="shrink-0 tabular-nums opacity-70">{{ node().count }}</span>
        <span class="w-12 shrink-0 text-right tabular-nums opacity-50">{{ sharePercentage() }}</span>
    </button>
</div>
