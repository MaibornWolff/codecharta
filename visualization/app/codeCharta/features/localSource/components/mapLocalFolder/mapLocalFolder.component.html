@if (isAvailable()) {
    <span class="flex min-w-0 flex-col text-xs opacity-60" data-testid="map-local-folder" title="Right-click to change these folders">
        <span class="flex items-center gap-1" data-testid="map-local-folder-name">
            <i class="fa-regular fa-folder w-3 shrink-0 text-center"></i>
            <span class="shrink-0">Folder:</span>
            <span class="truncate font-mono">{{ folder()?.folderName ?? "not set" }}</span>
        </span>
        <span class="flex items-center gap-1" data-testid="map-local-folder-editor-path">
            <i class="fa-solid fa-code w-3 shrink-0 text-center"></i>
            <span class="shrink-0">VS Code:</span>
            <span class="truncate font-mono">{{ folder()?.editorRootPath ?? "not set" }}</span>
        </span>
    </span>
}
