<div
    class="flex items-center"
    (click)="closeModeBar()"
    (mouseleave)="scheduleClosingModeBar()"
    (focusout)="closeModeBarWhenFocusLeaves($event)"
>
    <nav class="flex items-center gap-1" aria-label="View" data-testid="view-switcher">
        @for (tab of availableTabs(); track tab.view) {
            <a
                #tabLink="routerLinkActive"
                class="btn btn-ghost btn-sm relative"
                [class.font-bold]="tabLink.isActive"
                [routerLink]="routeLinks[tab.view]"
                routerLinkActive
                ariaCurrentWhenActive="page"
                [routerLinkActiveOptions]="{ exact: tab.matchesExactly }"
                [title]="tab.title"
                [attr.data-testid]="'view-switcher-' + tab.view"
                (mouseenter)="openModeBar(tab.view)"
                (focusin)="openModeBar(tab.view)"
            >
                {{ tab.label }}
                @if (tabLink.isActive) {
                    <span class="cc-current-underline"></span>
                }
            </a>
        }
    </nav>
    @if (previewedView(); as previewed) {
        <div
            class="absolute inset-x-0 top-full z-[70] border-b border-base-300 bg-base-100 shadow-md"
            data-testid="view-mode-bar-overlay"
            (mouseenter)="cancelPendingClose()"
            (mouseleave)="scheduleClosingModeBar()"
        >
            <cc-view-mode-bar [view]="previewed" />
        </div>
    } @else {
        <span
            class="absolute left-1/2 top-full z-[70] mt-px flex -translate-x-1/2 cursor-pointer items-center rounded-b-md border border-t-0 border-base-300 bg-base-100 px-2.5 pb-1 pt-0.5 text-base-content/40 shadow-sm hover:text-base-content/70"
            aria-hidden="true"
            data-testid="view-mode-bar-handle"
            (mouseenter)="openModeBar(activeView())"
        >
            <svg class="block h-1.5 w-2.5" viewBox="0 0 10 6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 1 5 5 9 1" />
            </svg>
        </span>
    }
</div>
