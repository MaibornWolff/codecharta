<div role="tablist" class="flex items-center gap-1">
    <button
        type="button"
        role="tab"
        [attr.aria-selected]="!isDeltaState()"
        class="btn btn-ghost btn-sm relative"
        [class.font-bold]="!isDeltaState()"
        (click)="selectExplore()"
    >
        Explore
        @if (!isDeltaState()) {
            <span class="cc-current-underline"></span>
        }
    </button>
    <button
        type="button"
        role="tab"
        [attr.aria-selected]="isDeltaState()"
        class="btn btn-ghost btn-sm relative"
        [class.font-bold]="isDeltaState()"
        (click)="selectCompare()"
    >
        Compare
        @if (isDeltaState()) {
            <span class="cc-current-underline"></span>
        }
    </button>
</div>
