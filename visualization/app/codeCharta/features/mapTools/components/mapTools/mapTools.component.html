<cc-unfocus-tool [isFocused]="isFocused()" testId="metrics-bar-unfocus" (unfocused)="unfocus()"></cc-unfocus-tool>
@if (isFocused()) {
    <cc-bar-tools-divider></cc-bar-tools-divider>
}
<cc-toolbox-center-map-button (zoomMenuRequested)="zoomMenuAnchor.set($event)"></cc-toolbox-center-map-button>
<cc-toolbox-presentation-mode-button></cc-toolbox-presentation-mode-button>
<cc-toolbox-screenshot-button view="metrics"></cc-toolbox-screenshot-button>

@if (zoomMenuAnchor(); as anchor) {
    <cc-center-map-zoom-menu [anchor]="anchor" (dismissed)="zoomMenuAnchor.set(null)"></cc-center-map-zoom-menu>
}
