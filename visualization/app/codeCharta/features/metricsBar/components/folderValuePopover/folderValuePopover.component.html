<cc-settings-popover-shell
    [popoverId]="popoverId()"
    [anchorName]="anchorName()"
    widthClass="w-80"
    ariaLabel="Folder value"
    testId="folder-value-popover"
>
    <div class="flex items-baseline justify-between gap-2">
        <span class="text-sm font-semibold whitespace-nowrap">
            Folders by <span class="text-primary" data-testid="folder-value-title">{{ title() }}</span>
        </span>
        <span class="min-w-0 truncate text-xs opacity-60">of {{ colorMetric() }}</span>
    </div>

    <div class="flex flex-col gap-0.5" role="radiogroup" aria-label="Folder value" [class.opacity-60]="isNeutral()">
        @for (option of options; track option.value) {
            <label
                class="flex cursor-pointer items-center gap-2 rounded-md px-2 py-1 text-left hover:bg-base-200 has-[:focus-visible]:outline-2"
                [class.bg-base-200]="option.value === selected()"
                [attr.data-testid]="'folder-value-' + option.value"
            >
                <input
                    type="radio"
                    class="sr-only"
                    [name]="popoverId() + '-value'"
                    [checked]="option.value === selected()"
                    (click)="valueSelected.emit(option.value)"
                />
                <span class="flex min-w-0 flex-1 flex-col">
                    <span class="text-sm font-medium">{{ option.label }}</span>
                    <span class="text-xs opacity-70">{{ option.description }}</span>
                </span>
                <i class="fa fa-check text-primary" [class.invisible]="option.value !== selected()" aria-hidden="true"></i>
            </label>
        }
    </div>

    <p class="text-xs opacity-70">{{ footnote() }}</p>
</cc-settings-popover-shell>
