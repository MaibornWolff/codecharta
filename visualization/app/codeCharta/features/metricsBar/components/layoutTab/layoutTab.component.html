<button
    type="button"
    class="flex items-center gap-1.5 h-7 px-3 bg-base-100 border border-b-0 border-base-300 rounded-t-md text-xs font-semibold cursor-pointer hover:text-primary"
    [attr.popovertarget]="popoverId"
    [style.anchor-name]="'--' + anchorName"
    [attr.data-anchor-name]="anchorName"
    data-testid="metrics-bar-layout-tab"
    title="Change the map layout"
>
    <span class="text-[10px] font-normal uppercase tracking-wide opacity-70">Layout</span>
    <cc-layout-glyph class="w-3.5 h-3.5" [layout]="layoutAlgorithm()" />
    <span>{{ layoutAlgorithm() }}</span>
    <i class="fa fa-caret-down text-[10px]" aria-hidden="true"></i>
</button>

<cc-settings-popover-shell
    [popoverId]="popoverId"
    [anchorName]="anchorName"
    widthClass="w-[34rem] max-w-[95vw]"
    contentClass="gap-2.5 p-3"
    ariaLabel="Map layout"
    testId="metrics-bar-layout-picker"
>
    <span class="text-xs font-bold">Map layout</span>
    <div class="grid grid-cols-2 gap-2">
        @for (option of layoutOptions; track option.layout) {
            <button
                type="button"
                class="grid grid-cols-[auto_1fr] items-start gap-x-3 gap-y-0.5 p-2 rounded-md border text-left cursor-pointer transition-colors"
                [class]="option.layout === layoutAlgorithm() ? 'border-primary bg-primary/5' : 'border-base-300 hover:border-primary/50'"
                [attr.aria-pressed]="option.layout === layoutAlgorithm()"
                [attr.data-layout]="option.layout"
                (click)="selectLayout(option.layout)"
            >
                <span
                    class="row-span-2 grid place-items-center w-11 h-11 rounded-md"
                    [class.bg-primary]="option.layout === layoutAlgorithm()"
                    [class.text-primary-content]="option.layout === layoutAlgorithm()"
                    [class.bg-base-200]="option.layout !== layoutAlgorithm()"
                >
                    <cc-layout-glyph class="w-7 h-7" [layout]="option.layout" />
                </span>
                <span class="text-sm font-semibold">{{ option.layout }}</span>
                <span class="text-xs opacity-70 leading-snug">{{ option.description }}</span>
            </button>
        }
    </div>

    @if (showMaxTreeMapFiles()) {
        <div class="flex flex-col gap-1">
            <span class="text-sm">Maximum TreeMap Files</span>
            <cc-slider-number-input
                ariaLabel="Maximum TreeMap Files"
                [min]="1"
                [max]="1000"
                [value]="maxTreeMapFiles()"
                (valueChange)="setMaxTreeMapFiles($event)"
            />
            <span class="text-xs opacity-70">Folders with up to {{ maxTreeMapFiles() }} files are drawn as a treemap.</span>
        </div>
    }

    @if (showRadialLevels()) {
        <div class="flex flex-col gap-1">
            <span class="text-sm">Visible levels</span>
            <cc-slider-number-input
                ariaLabel="Visible levels"
                [min]="minRadialLevels"
                [max]="maxRadialLevels"
                [value]="radialLevels()"
                (valueChange)="setRadialLevels($event)"
            />
            <span class="text-xs opacity-70">Shows {{ radialLevels() }} folder levels around the centre.</span>
        </div>
    }
</cc-settings-popover-shell>
