<span class="cc-bar-section"
      (click)="toggleShowAbsoluteValues.emit()"
      (contextmenu)="openContextMenu($event)">

      <div class="cc-bar-section-text my-0.5 whitespace-nowrap px-2.5 text-[10px]"
           data-test-id="formattedTitle"
           (mouseover)="onHoverFileExtensionBar(fileExtension())"
           (mouseleave)="onUnhoverFileExtensionBar()"
           [title]="formattedTitle()">
          {{ formattedTitle() }}
      </div>
</span>

@if (isPopoverShown() && popoverAnchor(); as anchor) {
    <cc-other-extensions-popover [total]="item()"
                                 [items]="groupedItems()"
                                 [showAbsoluteValues]="showAbsoluteValues()"
                                 [anchor]="anchor"
                                 (menuRequested)="openPopoverMenu($event)">
    </cc-other-extensions-popover>
}

@if (openMenu(); as menu) {
    <cc-file-extension-menu [fileExtension]="menu.fileExtension"
                            [position]="menu.position"
                            (closed)="closeContextMenu()">
    </cc-file-extension-menu>
}
