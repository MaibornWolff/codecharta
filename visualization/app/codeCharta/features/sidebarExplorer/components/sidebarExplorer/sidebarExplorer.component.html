@if (isCollapsed()) {
    <div class="flex items-center gap-1 px-2 py-1">
        <button
            type="button"
            class="btn btn-ghost btn-sm btn-square shrink-0"
            (click)="toggle()"
            title="Expand explorer"
            data-testid="explorer-expand-button"
        >
            <i class="fa-solid fa-folder-tree"></i>
        </button>

        <!--
            Collapsed, the tree is gone but the selection still drives the view, so the bar names what is
            selected. The path is the useful identity (names repeat across folders), truncated with the
            full value on hover.
        -->
        @if (selectedNodePath()) {
            <span class="flex-1 min-w-0 truncate text-xs opacity-70" [title]="selectedNodePath()" data-testid="explorer-collapsed-path">
                {{ selectedNodePath() }}
            </span>
            <button
                type="button"
                class="btn btn-ghost btn-sm btn-square shrink-0"
                [title]="copied() ? 'Copied!' : 'Copy path'"
                data-testid="explorer-copy-path-button"
                (click)="copySelectedPath()"
            >
                <i class="fa" [class.fa-copy]="!copied()" [class.fa-check]="copied()"></i>
            </button>
        } @else {
            <span class="flex-1 min-w-0 truncate text-xs opacity-50">{{ selectedNodeName() || "No selection" }}</span>
        }
    </div>
} @else {
    <cc-explorer-header></cc-explorer-header>
    @if (capabilities.showSearch) {
        <cc-explorer-search-bar></cc-explorer-search-bar>
    }
    <cc-explorer-sort-control></cc-explorer-sort-control>
    <div id="explorer-scroll" class="flex-1 overflow-auto px-1 py-1">
        <cc-explorer-tree></cc-explorer-tree>
    </div>
    @if (capabilities.showRules) {
        <cc-rules-popover kind="flatten" popoverId="explorer-flatten-rules" anchorName="explorer-flat-chip"></cc-rules-popover>
        <cc-rules-popover kind="exclude" popoverId="explorer-hidden-rules" anchorName="explorer-hidden-chip"></cc-rules-popover>
    }
    <div
        class="absolute right-0 top-0 h-full w-1.5 cursor-col-resize select-none hover:bg-primary/40 active:bg-primary/60"
        (pointerdown)="startResize($event)"
        (dblclick)="resetWidth()"
        title="Drag to resize, double-click to reset"
        data-testid="explorer-resize-handle"
    ></div>
}
