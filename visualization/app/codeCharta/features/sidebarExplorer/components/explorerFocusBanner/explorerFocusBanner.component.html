@if (isFocused?.()) {
    <div class="w-full px-2 mt-2">
        <button
            type="button"
            class="flex w-full cursor-pointer items-center gap-2 rounded-md bg-secondary/10 px-2 py-1 text-left text-xs text-secondary hover:bg-secondary/20 focus-visible:outline-2 focus-visible:outline-offset-1 focus-visible:outline-primary"
            title="Leave the focus and show the whole project"
            data-testid="explorer-focus-banner"
            (click)="unfocus()"
        >
            <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
            <span class="font-semibold">Focus mode</span>
            <span class="ml-auto underline">Show whole project</span>
        </button>
    </div>
}
