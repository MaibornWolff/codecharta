<div
    class="dropdown p-2 rounded-box bg-base-100 shadow-lg w-80"
    popover
    #popover
    [id]="popoverId()"
    [style.position-anchor]="'--' + anchorName()"
>
    <div class="flex items-center justify-between border-b border-base-300 pb-1 mb-1">
        <span class="text-sm font-semibold uppercase tracking-wide">{{ title() }}</span>
        <button
            type="button"
            class="btn btn-ghost btn-xs btn-square"
            (click)="closePopover()"
            title="Close"
            data-testid="rules-popover-close-button"
        >
            <i class="fa fa-times"></i>
        </button>
    </div>
    @if (rulesOfKind().length === 0) {
        <div class="text-xs opacity-60 px-2 py-3">No rules</div>
    } @else {
        <ul class="flex flex-col max-h-[60vh] overflow-y-auto m-0 p-0 list-none">
            @for (rule of rulesOfKind(); track rule.id) {
                <li>
                    <cc-rule-row [rule]="rule"></cc-rule-row>
                </li>
            }
        </ul>
    }
    @if (hasMetricRules || rulesOfKind().length > 0) {
        <div class="border-t border-base-300 mt-1 pt-1 flex flex-col gap-0.5">
            @if (hasMetricRules) {
                <button
                    type="button"
                    class="btn btn-ghost btn-xs w-full justify-start text-primary"
                    [attr.popovertarget]="editorPopoverId()"
                    data-testid="rules-popover-add-metric-rule-button"
                >
                    <i class="fa fa-plus"></i>
                    {{ kind() === "flatten" ? "Flatten by metric…" : "Exclude by metric…" }}
                </button>
            }
            @if (rulesOfKind().length > 0) {
                <button
                    type="button"
                    class="btn btn-ghost btn-xs w-full justify-start text-error"
                    (click)="requestClear()"
                    data-testid="rules-popover-clear-button"
                >
                    <i class="fa fa-undo"></i>
                    {{ clearLabel() }}
                </button>
            }
        </div>
    }
</div>

<cc-confirm-dialog
    #confirmDialog
    [title]="confirmTitle()"
    [message]="confirmMessage()"
    [testId]="confirmTestId()"
    (confirmed)="confirmClear()"
></cc-confirm-dialog>
