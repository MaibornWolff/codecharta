@if (breadcrumbs().length > 0) {
    <!--
        A block container, not a flex one: text-overflow only ellipsises inline content, so the crumbs must
        stay inline for a long path to end in an ellipsis instead of hard-clipping mid-glyph.
    -->
    <div class="text-xs leading-5 whitespace-nowrap overflow-hidden text-ellipsis" [attr.aria-live]="ariaLive()">
        @for (crumb of breadcrumbs(); track crumb.key) {
            @if (crumb.isLast) {
                <i
                    class="fa mx-1"
                    [class.fa-file-o]="isFile()"
                    [class.fa-folder]="!isFile()"
                ></i>
                <span class="font-semibold">{{ crumb.segment }}</span>
            } @else {
                <span>{{ crumb.segment }}</span>
                <i class="fa fa-angle-right text-base-content/40 mx-1"></i>
            }
        }
    </div>
}
