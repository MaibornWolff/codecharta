@let loadingState = loadingStateStream() | async;
<div
    id="loading-gif-file"
    class="fixed inset-0 z-[1000] flex items-center justify-center bg-white/80 text-center"
    [class.animate-fade-in-delayed]="loadingState?.fadesIn"
    [style.visibility]="loadingState?.isLoading ? 'visible' : 'hidden'"
>
    <!-- The caption hangs below the ring rather than sharing a column with it: centring the two together
         moves the ring every time the caption appears, changes length or goes away. -->
    <div class="relative flex items-center justify-center">
        <div class="h-24 w-24 animate-spin rounded-full border-4 border-base-300 [border-top-color:var(--color-primary)]"></div>
        @let loadPhase = loadPhaseStream() | async;
        @if (loadPhase) {
            <p
                class="absolute left-1/2 top-full mt-4 -translate-x-1/2 whitespace-nowrap text-sm opacity-70"
                data-testid="loading-phase"
            >
                {{ loadPhase }}
            </p>
        }
    </div>
</div>
