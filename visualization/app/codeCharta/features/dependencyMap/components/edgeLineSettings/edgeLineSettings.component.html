<cc-choice-row
    label="Line thickness"
    idPrefix="dependency-bar-edge-thickness"
    [choices]="edgeThicknessChoices"
    [chosen]="edgeWidth().thickness"
    (choose)="drawEdgesThick($event)"
></cc-choice-row>

<div class="flex flex-col gap-1">
    <span class="text-xs uppercase tracking-wider opacity-60">Width factor</span>
    <cc-slider-number-input
        ariaLabel="Line width factor"
        [min]="widthFactorRange.min"
        [max]="widthFactorRange.max"
        [step]="widthFactorRange.step"
        [value]="edgeWidth().factor"
        (valueChange)="scaleEdgeWidth($event)"
    ></cc-slider-number-input>
</div>

<cc-choice-row
    label="Line style shows"
    idPrefix="dependency-bar-line-style-shows"
    [choices]="lineStyleMeaningChoices"
    [chosen]="lineStyleShows()"
    (choose)="setLineStyleMeaning($event)"
></cc-choice-row>

<cc-reset-settings-button
    [settingsKeys]="resetKeys"
    [small]="true"
    tooltip="Reset the edge style, the line shape, the line thickness and what the line style shows to their defaults"
    label="Reset edge style"
></cc-reset-settings-button>
