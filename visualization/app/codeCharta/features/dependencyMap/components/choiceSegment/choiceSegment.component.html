<cc-axis-card
    [label]="label()"
    [metricName]="chosenLabel()"
    [searchPopoverId]="popoverId()"
    [searchAnchorName]="anchorName()"
    [testId]="idPrefix() + '-segment'"
></cc-axis-card>
<cc-settings-popover-shell [popoverId]="popoverId()" [anchorName]="anchorName()" [ariaLabel]="label()" widthClass="w-72" contentClass="gap-2 p-2">
    <ul class="m-0 flex list-none flex-col p-0">
        @for (choice of choices(); track choice.value) {
            <li class="flex">
                <button
                    type="button"
                    class="flex w-full cursor-pointer flex-col items-start gap-0.5 rounded border-0 px-2 py-1 text-left"
                    [class]="choice.value === chosen() ? 'bg-base-200 font-semibold' : 'bg-transparent hover:bg-base-200'"
                    [attr.aria-pressed]="choice.value === chosen()"
                    [attr.data-testid]="idPrefix() + '-' + choice.value"
                    (click)="pick(choice.value)"
                >
                    <span>{{ choice.label }}</span>
                    <span class="text-xs font-normal opacity-70">{{ choice.hint }}</span>
                </button>
            </li>
        }
    </ul>
    <ng-content></ng-content>
</cc-settings-popover-shell>
