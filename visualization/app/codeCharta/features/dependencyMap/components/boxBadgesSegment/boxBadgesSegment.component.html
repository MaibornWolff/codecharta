<cc-axis-card
    label="Badges"
    [searchPopoverId]="popoverId"
    [searchAnchorName]="anchorName"
    [minWidthClass]="cardWidthClass"
    testId="dependency-bar-box-badges-segment"
>
    <div body [class]="sampleRowClass + ' gap-1'" [title]="chosenLabel()" data-testid="dependency-bar-box-badges-shown">
        @for (entry of shownEntries(); track entry.mark) {
            <cc-box-badge-sample [mark]="entry.mark" [upwardLine]="upwardLine()"></cc-box-badge-sample>
        } @empty {
            <span class="text-sm font-semibold leading-tight" aria-hidden="true">None</span>
        }
        <span class="sr-only">{{ chosenLabel() }}</span>
    </div>
</cc-axis-card>
<cc-settings-popover-shell [popoverId]="popoverId" [anchorName]="anchorName" ariaLabel="Badges" contentClass="gap-2 p-2">
    <cc-selection-shortcuts (selectAll)="showAll()" (selectNone)="showNone()" (invert)="invert()"></cc-selection-shortcuts>
    <ul class="m-0 flex list-none flex-col gap-0.5 p-0">
        @for (entry of entries(); track entry.mark) {
            <li class="flex items-center gap-2 rounded-md px-2 py-1 hover:bg-base-200">
                <input
                    #boxBadgeCheckbox
                    type="checkbox"
                    class="checkbox checkbox-sm checkbox-primary shrink-0"
                    [id]="'dependency-bar-box-badges-' + entry.mark"
                    [checked]="entry.isShown"
                    [attr.data-testid]="'dependency-bar-box-badges-' + entry.mark"
                    (change)="toggle(entry.mark, boxBadgeCheckbox.checked)"
                />
                <cc-box-badge-sample [mark]="entry.mark" [upwardLine]="upwardLine()"></cc-box-badge-sample>
                <label class="min-w-0 flex-1 cursor-pointer text-sm" [attr.for]="'dependency-bar-box-badges-' + entry.mark">{{ entry.label }}</label>
            </li>
        }
    </ul>
    <cc-reset-settings-button
        [settingsKeys]="resetKeys"
        [small]="true"
        tooltip="Show every badge again"
        label="Reset badges"
    ></cc-reset-settings-button>
</cc-settings-popover-shell>
