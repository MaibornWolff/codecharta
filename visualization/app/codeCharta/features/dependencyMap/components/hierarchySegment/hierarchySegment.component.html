<cc-axis-card
    label="Hierarchy"
    [metricName]="hierarchyLabel()"
    [searchPopoverId]="popoverId"
    [searchAnchorName]="anchorName"
    testId="dependency-bar-hierarchy-segment"
></cc-axis-card>

<cc-choice-list-popover
    [popoverId]="popoverId"
    [anchorName]="anchorName"
    title="Files nested in their"
    idPrefix="dependency-bar-hierarchy"
    [choices]="hierarchyChoices"
    [chosen]="hierarchy()"
    (choose)="show($event)"
></cc-choice-list-popover>
