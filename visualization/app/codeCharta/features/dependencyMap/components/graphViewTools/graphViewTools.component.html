<cc-unfocus-tool [isFocused]="isFocused()" testId="dependency-bar-unfocus" (unfocused)="unfocus()"></cc-unfocus-tool>
<cc-bar-tool
    label="Reset layout"
    icon="fa fa-undo"
    tooltip="Put every dragged box back in its place"
    highlighted
    [revealed]="hasMovedBoxes()"
    testId="dependency-reset-layout"
    (activated)="resetLayout()"
></cc-bar-tool>
@if (hasSomethingToUndo()) {
    <cc-bar-tools-divider data-testid="dependency-tools-divider"></cc-bar-tools-divider>
}
<cc-bar-tool label="Show whole graph" icon="fa-solid fa-expand" testId="dependency-reset-view" (activated)="showWholeGraph()"></cc-bar-tool>
<cc-toolbox-screenshot-button view="dependencies"></cc-toolbox-screenshot-button>
