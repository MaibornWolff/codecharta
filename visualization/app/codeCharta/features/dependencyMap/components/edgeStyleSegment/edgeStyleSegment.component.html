<cc-axis-card
    label="Edge style"
    [metricName]="edgeStyleLabel()"
    [searchPopoverId]="stylePopoverId"
    [searchAnchorName]="styleAnchorName"
    testId="dependency-bar-edge-style-segment"
>
    <div body class="text-center text-xs opacity-70" data-testid="dependency-bar-edge-thickness-value">{{ edgeThicknessLabel() }}</div>
</cc-axis-card>

<cc-choice-list-popover
    [popoverId]="stylePopoverId"
    [anchorName]="styleAnchorName"
    title="Edges drawn"
    widthClass="w-96 max-w-[95vw]"
    idPrefix="dependency-bar-edge-style"
    [choices]="edgeStyleChoices"
    [chosen]="edgeStyle()"
    (choose)="drawEdgesAs($event)"
>
    @if (canDrawStraight()) {
        <div class="flex flex-col gap-2.5 border-t border-base-300 pt-2.5">
            <cc-choice-row
                label="Line shape"
                idPrefix="dependency-bar-edge-shape"
                [choices]="edgeShapeChoices"
                [chosen]="edgeShape()"
                (choose)="shapeEdges($event)"
            ></cc-choice-row>
            @if (canAnchorAtSideMiddle()) {
                <label class="flex cursor-pointer items-center gap-2">
                    <input
                        #sideMiddleCheckbox
                        type="checkbox"
                        class="checkbox checkbox-sm checkbox-primary"
                        data-testid="dependency-bar-edge-style-side-middle"
                        [checked]="isAnchoredAtSideMiddle()"
                        (change)="anchorAtSideMiddle(sideMiddleCheckbox.checked)"
                    />
                    <span class="text-sm">Start and end at the middle of the side</span>
                </label>
            }
        </div>
    }
    <cc-edge-line-settings></cc-edge-line-settings>
</cc-choice-list-popover>
