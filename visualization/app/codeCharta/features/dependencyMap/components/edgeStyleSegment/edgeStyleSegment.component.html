<cc-axis-card
    label="Edge style"
    [metricName]="edgeStyleLabel()"
    [hasCog]="true"
    [cogPopoverId]="settingsPopoverId"
    [cogAnchorName]="settingsAnchorName"
    [searchPopoverId]="stylePopoverId"
    [searchAnchorName]="styleAnchorName"
    testId="dependency-bar-edge-style-segment"
    cogTestId="dependency-bar-edge-style-cog"
>
    <div body class="text-center text-xs opacity-70" data-testid="dependency-bar-edge-thickness-value">{{ edgeThicknessLabel() }}</div>
</cc-axis-card>

<cc-choice-list-popover
    [popoverId]="stylePopoverId"
    [anchorName]="styleAnchorName"
    title="Edges drawn"
    idPrefix="dependency-bar-edge-style"
    [choices]="edgeStyleChoices"
    [chosen]="edgeStyle()"
    (choose)="drawEdgesAs($event)"
>
    <div class="flex flex-col gap-1 border-t border-base-300 pt-2.5">
        <label
            class="flex items-center gap-2"
            [class]="canAnchorAtSideMiddle() ? 'cursor-pointer' : 'cursor-not-allowed opacity-50'"
        >
            <input
                #sideMiddleCheckbox
                type="checkbox"
                class="checkbox checkbox-sm checkbox-primary"
                data-testid="dependency-bar-edge-style-side-middle"
                [checked]="isAnchoredAtSideMiddle()"
                [disabled]="!canAnchorAtSideMiddle()"
                (change)="anchorAtSideMiddle(sideMiddleCheckbox.checked)"
            />
            <span class="text-sm">Start and end at the middle of the side</span>
        </label>
        @if (!canAnchorAtSideMiddle()) {
            <p class="m-0 text-xs opacity-70" data-testid="dependency-bar-edge-style-side-middle-note">
                Not for {{ edgeStyleLabel() }}, which gives each edge its own spot.
            </p>
        }
    </div>
</cc-choice-list-popover>

<cc-edge-style-settings-popover [popoverId]="settingsPopoverId" [anchorName]="settingsAnchorName"></cc-edge-style-settings-popover>
