<cc-axis-card
    label="Declarations"
    [metricName]="arrangementLabel()"
    [searchPopoverId]="popoverId"
    [searchAnchorName]="anchorName"
    testId="dependency-bar-declarations-segment"
></cc-axis-card>

<cc-choice-list-popover
    [popoverId]="popoverId"
    [anchorName]="anchorName"
    title="Declarations in a file"
    idPrefix="dependency-bar-declaration-arrangement"
    [choices]="arrangementChoices"
    [chosen]="arrangement()"
    (choose)="arrangeAs($event)"
>
    <div class="border-t border-base-300 pt-2.5">
        <cc-choice-row
            label="Kind shown as"
            idPrefix="dependency-bar-declaration-kind"
            [choices]="kindMarkChoices"
            [chosen]="kindMark()"
            (choose)="markKindBy($event)"
        ></cc-choice-row>
        <label class="mt-2.5 flex cursor-pointer items-center gap-2">
            <input
                #cycleBadgesCheckbox
                type="checkbox"
                class="checkbox checkbox-sm checkbox-primary"
                data-testid="dependency-bar-cycle-badges"
                [checked]="showsCycleBadges()"
                (change)="showCycleBadges(cycleBadgesCheckbox.checked)"
            />
            <span class="text-sm">Count the cyclic dependencies a closed box hides</span>
        </label>
    </div>
</cc-choice-list-popover>
