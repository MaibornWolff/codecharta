<section class="flex flex-col gap-1" aria-labelledby="dependency-edge-legend-title">
    <span id="dependency-edge-legend-title" class="text-xs uppercase tracking-wider opacity-60">{{ isDependencyMetric() ? "Dependencies" : "Edges" }}</span>
    <ul class="m-0 flex list-none flex-col gap-1 p-0 text-sm" data-testid="dependency-edge-legend">
        @for (entry of edgeLegend(); track entry.type) {
            <li class="flex items-center gap-2">
                <svg class="h-2 w-6" viewBox="0 0 24 8" aria-hidden="true">
                    <line x1="0" y1="4" x2="24" y2="4" stroke-width="2" [attr.stroke]="entry.color" [attr.stroke-dasharray]="entry.isDashed ? '5 4' : null" />
                </svg>
                <span>{{ entry.label }}</span>
            </li>
        }
    </ul>
</section>
