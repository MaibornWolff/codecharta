<svg
    class="h-3 w-11"
    viewBox="0 0 44 12"
    [attr.role]="label() === null ? null : 'img'"
    [attr.aria-label]="label()"
    [attr.aria-hidden]="label() === null ? 'true' : null"
    [attr.stroke]="color()"
    [attr.fill]="color()"
>
    <line x1="2" y1="6" x2="32" y2="6" stroke-width="1.6" [attr.stroke-dasharray]="line().dash?.join(' ') ?? null" />
    @switch (line().head) {
        @case ("hollow") {
            <polygon points="41,6 32,2 32,10" fill="var(--color-base-100, #fff)" stroke-width="1.3" />
        }
        @case ("open") {
            <polyline points="32,2 41,6 32,10" fill="none" stroke-width="1.5" />
        }
        @case ("dot") {
            <circle cx="37" cy="6" r="3.5" stroke="none" />
        }
        @default {
            <polygon points="41,6 32,2 32,10" stroke="none" />
        }
    }
</svg>
