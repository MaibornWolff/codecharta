<svg aria-hidden="true" [attr.viewBox]="viewBox" [attr.width]="sizes.widthPx" [attr.height]="sizes.heightPx" [attr.data-mark]="mark()">
    @if (pill(); as pill) {
        <rect
            [attr.x]="pillShape.x"
            [attr.y]="pillShape.y"
            [attr.width]="pillShape.width"
            [attr.height]="pillShape.height"
            [attr.rx]="pillShape.cornerRadius"
            [attr.stroke-width]="sizes.outlinePx"
            [attr.stroke-dasharray]="dash()"
            [attr.fill]="pill.colors.fill"
            [attr.stroke]="pill.colors.line"
        />
        <g [attr.transform]="glyphPlace">
            <path fill="none" stroke-linecap="round" [attr.d]="pill.glyph.line" [attr.stroke-width]="pill.glyph.lineWidthPx" [attr.stroke]="pill.colors.line" />
            <path stroke="none" [attr.d]="pill.glyph.head" [attr.fill]="pill.colors.line" />
        </g>
        <text
            dominant-baseline="central"
            [attr.x]="sizes.numberLeftPx"
            [attr.y]="centre.y"
            [attr.font-size]="sizes.fontSizePx"
            [attr.font-weight]="sizes.fontWeight"
            [attr.font-family]="sizes.fontFamily"
            [attr.fill]="pill.colors.line"
        >
            {{ sizes.count }}
        </text>
    } @else {
        <circle
            [attr.cx]="centre.x"
            [attr.cy]="centre.y"
            [attr.r]="sizes.ringRadiusPx"
            [attr.stroke-width]="sizes.ringLineWidthPx"
            [attr.fill]="ringColors.fill"
            [attr.stroke]="ringColors.line"
        />
    }
</svg>
