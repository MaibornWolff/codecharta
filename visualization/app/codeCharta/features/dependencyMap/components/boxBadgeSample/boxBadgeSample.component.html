<svg aria-hidden="true" [attr.viewBox]="viewBox" [attr.width]="sizes.widthPx" [attr.height]="sizes.heightPx" [attr.data-mark]="mark()">
    @if (mark() === "declaration") {
        <circle
            [attr.cx]="centre.x"
            [attr.cy]="centre.y"
            [attr.r]="sizes.ringRadiusPx"
            [attr.stroke-width]="sizes.ringLineWidthPx"
            [attr.fill]="colors().fill"
            [attr.stroke]="colors().line"
        />
    } @else {
        <rect
            [attr.x]="pill.x"
            [attr.y]="pill.y"
            [attr.width]="pill.width"
            [attr.height]="pill.height"
            [attr.rx]="pill.cornerRadius"
            [attr.stroke-width]="sizes.outlinePx"
            [attr.stroke-dasharray]="dash()"
            [attr.fill]="colors().fill"
            [attr.stroke]="colors().line"
        />
        <g [attr.transform]="glyphPlace">
            <path fill="none" stroke-linecap="round" [attr.d]="glyph().line" [attr.stroke-width]="glyph().lineWidthPx" [attr.stroke]="colors().line" />
            <path stroke="none" [attr.d]="glyph().head" [attr.fill]="colors().line" />
        </g>
        <text
            dominant-baseline="central"
            [attr.x]="sizes.numberLeftPx"
            [attr.y]="centre.y"
            [attr.font-size]="sizes.fontSizePx"
            [attr.font-weight]="sizes.fontWeight"
            [attr.font-family]="sizes.fontFamily"
            [attr.fill]="colors().line"
        >
            {{ sizes.count }}
        </text>
    }
</svg>
