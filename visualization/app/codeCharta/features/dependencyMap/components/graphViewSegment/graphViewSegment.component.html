<span class="text-[10px] uppercase tracking-wide opacity-70">View</span>
<div class="join">
    <button
        type="button"
        class="btn btn-sm btn-square join-item"
        title="Show the whole graph"
        aria-label="Show the whole graph"
        data-testid="dependency-reset-view"
        (click)="showWholeGraph()"
    >
        <i class="fa-solid fa-expand" aria-hidden="true"></i>
    </button>
    @if (hasMovedBoxes()) {
        <button
            type="button"
            class="btn btn-sm join-item"
            title="Put every dragged box back in its place"
            data-testid="dependency-reset-layout"
            (click)="resetLayout()"
        >
            Reset layout
        </button>
    }
    @if (isFocused()) {
        <button
            type="button"
            class="btn btn-sm join-item"
            title="Leave the focus and show every folder"
            data-testid="dependency-bar-unfocus"
            (click)="unfocus()"
        >
            <i class="fa-solid fa-crosshairs" aria-hidden="true"></i>
            Unfocus
        </button>
    }
</div>
