<cc-axis-card
    label="Labels"
    [metricName]="chosenLabel()"
    [searchPopoverId]="popoverId"
    [searchAnchorName]="anchorName"
    testId="dependency-bar-level-label-segment"
></cc-axis-card>

<cc-choice-list-popover
    [popoverId]="popoverId"
    [anchorName]="anchorName"
    title="Levels labelled by"
    idPrefix="dependency-bar-level-label"
    [choices]="levelLabelChoices"
    [chosen]="levelLabel()"
    (choose)="labelLevelsBy($event)"
>
    @if (hasDeclarations()) {
        <label class="flex cursor-pointer items-center gap-2 border-t border-base-300 pt-2.5">
            <input
                #cycleBadgesCheckbox
                type="checkbox"
                class="checkbox checkbox-sm checkbox-primary"
                data-testid="dependency-bar-cycle-badges"
                [checked]="showsCycleBadges()"
                (change)="showCycleBadges(cycleBadgesCheckbox.checked)"
            />
            <span class="text-sm">Count the cyclic dependencies a closed box hides</span>
        </label>
    }
</cc-choice-list-popover>
