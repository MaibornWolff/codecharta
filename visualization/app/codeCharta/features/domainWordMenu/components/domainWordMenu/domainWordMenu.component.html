@if (anchor(); as anchor) {
    <cc-floating-menu class="w-56" data-testid="domain-word-menu" [anchor]="anchor" (dismissed)="close()">
        <button
            type="button"
            class="flex w-full items-center gap-3 px-4 py-2.5 text-left hover:bg-base-200"
            title="Copy word to clipboard"
            data-testid="domain-word-menu-copy"
            (click)="copyWord()"
        >
            <i class="w-4 text-center {{ wasWordCopied() ? 'fa-solid fa-check text-success' : 'fa-regular fa-copy' }}"></i>
            <span class="truncate text-sm font-semibold tracking-wide">{{ rightClickedWord()?.word }}</span>
        </button>

        <div class="my-1 border-t border-base-300"></div>

        <cc-context-menu-item
            icon="fa-solid fa-magnifying-glass-chart"
            hoverHint="List the folders and files this word occurs in"
            (itemClick)="inspectWord()"
        >
            Show occurrences
        </cc-context-menu-item>

        <cc-context-menu-item
            icon="fa-solid fa-eye-slash"
            hoverHint="Drop this word from the cloud and the word list"
            (itemClick)="hideThisWord()"
        >
            Hide word
        </cc-context-menu-item>

    </cc-floating-menu>
}
