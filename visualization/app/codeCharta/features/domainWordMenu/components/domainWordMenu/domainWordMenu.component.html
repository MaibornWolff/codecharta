@if (anchor(); as anchor) {
    <cc-floating-menu class="w-56" data-testid="domain-word-menu" [anchor]="anchor" (dismissed)="close()">
        <div class="truncate px-4 py-2.5 text-sm font-semibold tracking-wide">{{ rightClickedWord()?.word }}</div>

        <div class="my-1 border-t border-base-300"></div>

        <cc-context-menu-item
            icon="fa-solid fa-magnifying-glass-chart"
            hoverHint="List the folders and files this word occurs in"
            (itemClick)="inspectWord()"
        >
            Show occurrences
        </cc-context-menu-item>

        <cc-context-menu-item
            [icon]="wasWordCopied() ? 'fa-solid fa-check text-success' : 'fa-regular fa-copy'"
            hoverHint="Copy the word to the clipboard"
            (itemClick)="copyWord()"
        >
            Copy word
        </cc-context-menu-item>
    </cc-floating-menu>
}
