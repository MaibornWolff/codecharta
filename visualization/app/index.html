<!doctype html>
<html lang="en" data-theme="codecharta">
    <head>
        <title>CodeCharta</title>
        <!-- The sha256 allows Angular's critical-CSS handler onload="this.media='all'"; if the build changes it,
             regenerate with: printf "%s" "<handler>" | openssl dgst -sha256 -binary | base64 -->
        <meta
            charset="utf-8"
            http-equiv="Content-Security-Policy"
            content="default-src 'self';
					 script-src 'self' 'unsafe-eval' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc=';
					 style-src 'self' 'unsafe-inline';
					 img-src 'self' data: https://github.com https://user-images.githubusercontent.com https://github-production-user-asset-6210df.s3.amazonaws.com;"
        />
        <base href="./" />
        <link rel="icon" type="image/x-icon" href="codeCharta/assets/favicon.ico" />
        <style>
            @keyframes cc-boot-spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>

    <body>
        <!-- Shown until the bundle has been downloaded, parsed and bootstrapped, which is a blank page
             otherwise. Angular clears the host element's content when it renders the component, so this
             needs no script to remove it. The id differs from the app's own spinner on purpose: the e2e
             helpers locate `loading-gif-file` strictly and a second element carrying it fails them. -->
        <cc-code-charta>
            <div
                id="boot-loading"
                style="
                    position: fixed;
                    inset: 0;
                    display: flex;
                    flex-direction: column;
                    align-items: center;
                    justify-content: center;
                    background: #fff;
                    font-family: system-ui, sans-serif;
                "
            >
                <div
                    style="
                        width: 6rem;
                        height: 6rem;
                        border: 4px solid #d6dbe1;
                        border-top-color: #2f7ed8;
                        border-radius: 9999px;
                        animation: cc-boot-spin 1s linear infinite;
                    "
                ></div>
                <p style="margin-top: 1rem; font-size: 0.875rem; opacity: 0.7">Starting CodeCharta</p>
            </div>
        </cc-code-charta>
    </body>
</html>
