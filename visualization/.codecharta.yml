## Quality gate for `ccsh gate`: https://maibornwolff.github.io/codecharta/docs/analysis/quality-gate
## Uncomment what you want to check, then run `ccsh gate --doctor`. Anything left commented out is not checked or
## keeps its default; only the analysers listed as on run. Paths are relative to the project folder.

# input: .
# output: .codecharta-gate-output
parallel: on

# exclude:  ## .gitignore patterns of files no rule checks
#   - "**/generated/**"

analysers:  ## on, off, or the analyser's own options instead of on (its exclude takes regular expressions)
  rawtextparser: on
    ## options: verbose, exclude, include-build-folders, file-extensions, base-file, bypass-gitignore, local-changes, commit, metrics, tab-width, max-indentation-level, without-default-excludes
  unifiedparser: on
    ## options: verbose, exclude, include-build-folders, file-extensions, base-file, bypass-gitignore, local-changes, commit
  dependencyparser: on
    ## options: verbose, exclude, include-build-folders, file-extensions, base-file, bypass-gitignore, local-changes, commit, include-tests, max-file-size, file-timeout, omit-graph-analysis
  domainlanguageparser: off
    ## options: verbose, exclude, include-build-folders, file-extensions, base-file, bypass-gitignore, local-changes, commit, limit, ngrams, stop-word-level, identifier-weight, comment-weight, string-weight, exclude-tests, no-technical-stopwords, no-tfidf, sort-by, no-ssr

exitCodes:
  error: 1
  warning: 0

