metrics:
  complexity:
    warning:
      max: 100
      instruction: |
        This file does too much. Single Responsibility: one file, one reason to change.
        - Find the responsibilities mixed in here and move each one into a class of its own.
        - Have callers depend on small interfaces instead of this one large unit (Interface Segregation).
        - KISS: remove branches for cases that never happen instead of handling them.
  rloc:
    warning:
      max: 500
      instruction: |
        This file has grown too long to read in one go.
        - Split it along its responsibilities (Single Responsibility), not at an arbitrary line.
        - Extract repeated logic into a shared helper (DRY: 3+ occurrences means extract).
        - Delete dead code and speculative extensions (KISS, YAGNI).
  max_complexity_per_function:
    warning:
      max: 20
      instruction: |
        One function here has too many paths to understand or test.
        - Return early from error and edge cases (guard clauses) instead of nesting.
        - Extract each step into a small, well-named function that does one thing.
        - Replace long if/else or switch chains on a type with polymorphism (Open/Closed).
  comment_lines:
    warning:
      max: 25
      instruction: |
        Clean Code: code should explain itself, and comments go stale.
        - Replace a comment that says WHAT the code does with a better name, a named helper or a named constant.
        - Keep only comments that explain WHY: a constraint, a workaround with its issue, a deliberate trade-off.
        - Delete commented-out code. Git keeps the history.

dependencies:  ## counted like the dependency view in the visualization
  cyclesBetweenFiles:
    severity: error
    instruction: |
      These files depend on each other in a loop, so you cannot change, test or reuse one without the others.
      - Move what both files need into a file of its own that both depend on (Single Responsibility).
      - Or let the lower file own an interface and have the other file implement it (Dependency Inversion).
      - KISS: if the files only make sense together, merge them instead of adding indirection.
  cyclesInsideFiles:
    severity: warning
    instruction: |
      Declarations in this file call each other in a loop, which hides the order the code runs in.
      - Find the responsibilities tangled together here and give each one its own class (Single Responsibility).
      - Pass the part one side needs as a parameter or callback instead of reaching back (Dependency Inversion).
      - Unwind mutual recursion into a single function or a loop when that reads simpler (KISS).
  upward:
    severity: warning
    instruction: |
      A lower-level part depends on a part above it, so the layering points the wrong way and core code knows
      about its callers.
      - Let the lower level define the interface it needs and have the upper level implement it (Dependency Inversion).
      - If the lower level really needs this code, move it down to where it belongs.
      - Never import from the layer that uses you. Keep dependencies pointing one way (Open/Closed, KISS).

overrides:  ## tests and mocks may be long and explain themselves in comments; complex test logic still counts
  - paths:
      - "**/*.spec.ts"
      - "**/*.e2e.ts"
      - "**/e2e/**"
      - "**/mocks/**"
      - "**/*[mM]ocks.ts"
      - "app/playwright.helper.ts"
    metrics:
      rloc: off
      comment_lines: off
