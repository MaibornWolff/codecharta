[versions]
kotlin-logging = "8.0.01"
boon = "0.34"
commons-lang3 = "3.20.0"
cyclonedx = "3.2.0"
gson = "2.13.2"
jacoco = "0.8.11"
jersey = "4.0.2"
json-schema = "1.14.4"
json = "20251224"
juniversalchardet = "1.0.3"
kotlin = "2.3.10"
kotlinx-coroutines = "1.10.2"
kasechange = "1.4.1"
kotlinx-serialization-json = "1.7.3"
kotter = "1.2.1"
picocli = "4.7.7"
# TreeSitter core plus every grammar binding the treeSitterExcavationSite module loads. The go,
# javascript, php, python and vue pins are also compile-visible to the dependency parser, which
# queries those grammars directly; they must stay on the versions the module declares, or the ccsh
# fat jar carries two conflicting sets of natives.
tree-sitter = "0.26.3"
tree-sitter-bash = "0.23.3"
tree-sitter-c = "0.23.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-csharp = "0.23.1"
tree-sitter-go = "0.23.3"
tree-sitter-java = "0.23.4"
tree-sitter-javascript = "0.23.1"
tree-sitter-kotlin = "0.3.8.1"
tree-sitter-objc = "main-a"
tree-sitter-php = "0.23.11"
tree-sitter-python = "0.23.4"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.0"
tree-sitter-swift = "0.5.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-vue = "0.2.1a"
# tree-sitter-ng is an experimental fork with ABL support, published through JitPack
tree-sitter-abl = "de274a6"
# tree-sitter-tsx and tree-sitter-pascal are not on Maven Central; the module bundles them as
# treeSitterExcavationSite/libs/*.jar, built from https://github.com/bonede/tree-sitter-ng
slf4j = "2.0.17"
sonarqube = "7.2.2.6593"
univocity-parsers = "2.9.1"
appmattus-crypto = "1.0.2"
archunit = "1.4.1"
assertj = "3.27.7"
junit5 = "6.0.3"
ktlint = "14.0.1"
mockk = "1.14.9"
wiremock = "3.13.2"

[libraries]
kotlin-logging-jvm = { group = "io.github.oshai", name = "kotlin-logging-jvm", version.ref = "kotlin-logging" }
kotlinx-coroutines-core = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
junit-jupiter-api = { group = "org.junit.jupiter", name = "junit-jupiter-api", version.ref = "junit5" }
