appmattus-crypto = { group = "com.appmattus.crypto", name = "cryptohash", version.ref = "appmattus-crypto"}
tree-sitter = { group = "io.github.bonede", name = "tree-sitter", version.ref = "tree-sitter" }
tree-sitter-bash = { group = "io.github.bonede", name = "tree-sitter-bash", version.ref = "tree-sitter-bash" }
